name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plugins:
        description: "Space-separated plugin names, or 'all'"
        required: false
        default: 'all'
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Marketplace
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate marketplace.json
        run: |
          set -euo pipefail
          printf "%s\n" "Validating marketplace.json..."
          python3 scripts/validate_marketplace.py

      - name: Verify plugin source sync inventory
        run: bash scripts/test-sync-plugins.sh

      - name: Verify docs currency
        run: |
          set -euo pipefail
          printf "%s\n" "Verifying per-server docs are current with shipped plugin.json..."
          python3 scripts/verify_docs_current.py

      - name: Validate portable harness adapter schema
        run: python3 scripts/test_harness_adapter_schema.py

      - name: Verify plugin docs classification and sync
        run: node --test docs/scripts/test-sync-plugin-docs.mjs

      - name: Check version freshness
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf "%s\n" "Checking marketplace versions against latest releases..."
          python3 scripts/check_version_freshness.py

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  # Asks each shipped server for its own tool list (MCP `tools/list`) and
  # compares it against the names documented in plugins/<name>/tools.md.
  # Needed because nothing else closes this loop: the plugin-sync job copies
  # plugin.json / skills / hooks from the source repos but never the .md pages,
  # and plugin.json carries no tool list at all. A server can rename a tool and
  # the marketplace + docs site keep showing the old name.
  # The original path-filtered triggers are folded into the shared CI triggers;
  # the Select step below already no-ops when no plugin-relevant file changed.
  parity:
    name: Verify tool names
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: tool-parity-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Select plugins to check
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DISPATCH_PLUGINS: ${{ inputs.plugins }}
        run: |
          set -euo pipefail

          case "$EVENT" in
            pull_request)
              # fetch-depth: 0 above already provides every origin/* branch.
              CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
              ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
              else
                CHANGED=$(git diff --name-only HEAD~1 HEAD)
              fi
              ;;
            *)
              CHANGED=""
              ;;
          esac

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_PLUGINS" = "all" ] || [ -z "$DISPATCH_PLUGINS" ]; then
              SELECTED="--all"
            else
              SELECTED="$DISPATCH_PLUGINS"
            fi
          else
            # Map changed paths back to plugin directory names (only existing directories).
            SELECTED=$(printf '%s\n' "$CHANGED" \
              | sed -n 's#^plugins/\([^/]*\)/.*#\1#p' \
              | sort -u | while read -r p; do
                if [ -n "$p" ] && [ -d "plugins/$p" ]; then
                  echo "$p"
                fi
              done | tr '\n' ' ')
            # A change to the checker or this workflow re-checks everything.
            if printf '%s\n' "$CHANGED" | grep -qE '^(scripts/verify_tool_parity\.py|\.github/workflows/ci\.yml)$'; then
              SELECTED="--all"
            fi
          fi

          SELECTED=$(printf '%s' "$SELECTED" | xargs || true)
          printf "selected=%s\n" "$SELECTED" >> "$GITHUB_OUTPUT"
          printf "Checking: %s\n" "${SELECTED:-<nothing>}"

      - name: Verify tool names against live tools/list
        if: steps.select.outputs.selected != ''
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          python3 scripts/verify_tool_parity.py ${{ steps.select.outputs.selected }}
