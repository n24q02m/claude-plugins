name: CD

on:
  # ci-policy: allow trigger reason: plugin-sync is fired by the MCP source repos' release CD (explicit API dispatch, never push/PR/schedule)
  repository_dispatch:
    types: [plugin-sync]
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repo name (e.g., wet)"
        required: true
        type: choice
        # Renamed source repos are listed under both names; the pre-rename
        # names stay accepted until every renamed repo dispatches the new one.
        options:
          - wet
          - wet-mcp
          - mnemo
          - mnemo-mcp
          - telegram
          - better-telegram-mcp
          - crg
          - better-code-review-graph
          - notion
          - better-notion-mcp
          - email
          - better-email-mcp
          - workspace
          - better-workspace-mcp
      tag:
        description: "Release tag (e.g., v2.18.1)"
        required: true
        type: string

permissions:
  contents: write

# ci-policy: allow concurrency reason: serialize plugin syncs, never cancel one mid-push
concurrency:
  group: plugin-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Plugin
    # repository_dispatch must be narrowed to plugin-sync: the payload carries
    # the repo/tag that the sync path consumes, so guard the action explicitly
    # instead of relying only on the `types` filter above.
    if: (github.event_name == 'repository_dispatch' && github.event.action == 'plugin-sync') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - name: Resolve inputs
        id: inputs
        env:
          REPO: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repo || inputs.repo }}
          TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag }}
        run: |
          set -euo pipefail
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          printf "repo<<%s\n" "$EOF" >> "$GITHUB_OUTPUT"
          printf "%s\n" "$REPO" >> "$GITHUB_OUTPUT"
          printf "%s\n" "$EOF" >> "$GITHUB_OUTPUT"
          printf "tag<<%s\n" "$EOF" >> "$GITHUB_OUTPUT"
          printf "%s\n" "$TAG" >> "$GITHUB_OUTPUT"
          printf "%s\n" "$EOF" >> "$GITHUB_OUTPUT"

      - name: Validate inputs
        env:
          REPO: ${{ steps.inputs.outputs.repo }}
          TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -euo pipefail

          sanitize() {
            local val="$1"
            val="${val//%/%25}"
            val="${val//$'\r'/%0D}"
            val="${val//$'\n'/%0A}"
            printf "%s" "$val"
          }

          case "$REPO" in
            wet|wet-mcp|mnemo|mnemo-mcp|telegram|better-telegram-mcp|crg|better-code-review-graph|notion|better-notion-mcp|email|better-email-mcp|workspace|better-workspace-mcp)
              ;;
            *)
              printf "::error::Invalid repo: %s\n" "$(sanitize "$REPO")"
              exit 1
              ;;
          esac
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf "::error::Invalid tag format: %s (expected vX.Y.Z)\n" "$(sanitize "$TAG")"
            exit 1
          fi
          printf "Syncing %s @ %s\n" "$(sanitize "$REPO")" "$(sanitize "$TAG")"

      - name: Checkout marketplace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: marketplace

      - name: Checkout source repo at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: n24q02m/${{ steps.inputs.outputs.repo }}
          ref: ${{ steps.inputs.outputs.tag }}
          path: source
          token: ${{ steps.app-token.outputs.token }}

      - name: Sync plugin files
        env:
          REPO: ${{ steps.inputs.outputs.repo }}
          TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -euo pipefail
          # Both the pre-rename and the current repo name sync into the
          # current plugin folder (plugins/wet, plugins/mnemo, plugins/crg).
          case "$REPO" in
            wet-mcp) PLUGIN_NAME=wet ;;
            mnemo-mcp) PLUGIN_NAME=mnemo ;;
            better-code-review-graph) PLUGIN_NAME=crg ;;
            better-workspace-mcp) PLUGIN_NAME=workspace ;;
            better-notion-mcp) PLUGIN_NAME=notion ;;
            better-email-mcp) PLUGIN_NAME=email ;;
            better-telegram-mcp) PLUGIN_NAME=telegram ;;
            *) PLUGIN_NAME="$REPO" ;;
          esac
          PLUGIN_DIR="marketplace/plugins/$PLUGIN_NAME"
          VERSION="${TAG#v}"

          # Sync plugin.json
          if [ -f "source/.claude-plugin/plugin.json" ]; then
            mkdir -p "$PLUGIN_DIR/.claude-plugin"
            cp "source/.claude-plugin/plugin.json" "$PLUGIN_DIR/.claude-plugin/plugin.json"
            printf "Synced plugin.json\n"
          fi

          # Sync gemini-extension.json (update version)
          if [ -f "source/gemini-extension.json" ]; then
            mkdir -p "$PLUGIN_DIR"
            jq --arg v "$VERSION" '.version = $v' source/gemini-extension.json > "$PLUGIN_DIR/gemini-extension.json"
            printf "Synced gemini-extension.json (version: %s)\n" "$VERSION"
          fi

          # Sync skills
          if [ -d "source/skills" ] && (shopt -s nullglob; set -- source/skills/*/SKILL.md; [ $# -gt 0 ]); then
            rm -rf "$PLUGIN_DIR/skills"
            cp -r "source/skills" "$PLUGIN_DIR/skills"
            printf "Synced skills/\n"
          fi

          # Sync hooks
          if [ -d "source/hooks" ] && (shopt -s nullglob; set -- source/hooks/*; [ $# -gt 0 ]); then
            rm -rf "$PLUGIN_DIR/hooks"
            cp -r "source/hooks" "$PLUGIN_DIR/hooks"
            printf "Synced hooks/\n"
          fi

          # Sync commands (non-MCP plugins; no-op otherwise)
          if [ -d "source/commands" ] && (shopt -s nullglob; set -- source/commands/*; [ $# -gt 0 ]); then
            rm -rf "$PLUGIN_DIR/commands"
            cp -r "source/commands" "$PLUGIN_DIR/commands"
            printf "Synced commands/\n"
          fi

          # Sync top-level runtime entrypoint (non-MCP plugins; no-op otherwise)
          if [ -f "source/chat.py" ]; then
            cp "source/chat.py" "$PLUGIN_DIR/chat.py"
            printf "Synced chat.py\n"
          fi



      - name: Commit and push
        env:
          REPO: ${{ steps.inputs.outputs.repo }}
          TAG: ${{ steps.inputs.outputs.tag }}
        working-directory: marketplace
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          git config user.name "n24q02m-ci[bot]"
          git config user.email "n24q02m-ci[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            printf "No changes to sync\n"
            exit 0
          fi
          COMMIT_MSG="chore(plugins): sync $REPO to $VERSION"
          git commit -m "$COMMIT_MSG"
          # Retry push on race with concurrent plugin-sync runs.
          # Concurrency group serializes most cases, but rapid
          # repository_dispatch bursts can still produce push-time
          # races (rejected: fetch first). Rebase + retry handles them.
          attempt=0
          max_attempts=5
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              printf "::error::Push failed after %d attempts\n" "$attempt"
              exit 1
            fi
            printf "Push rejected (attempt %d/%d), rebasing onto origin/main and retrying\n" \
              "$attempt" "$max_attempts"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          printf "Pushed sync for %s %s (after %d attempt(s))\n" "$REPO" "$VERSION" "$((attempt + 1))"
