# Generated by scripts/generate_ide_manifests.py -- do not edit manually.

[mcp_servers.wet]
url = "http://127.0.0.1:8000/mcp"
bearer_token_env_var = "WET_TOKEN"

[mcp_servers.mnemo]
url = "${MNEMO_URL}"
bearer_token_env_var = "MNEMO_TOKEN"

[mcp_servers.notion]
command = "npx"
args = ["--yes", "@n24q02m/notion@latest"]

[mcp_servers.notion.env]
MCP_TRANSPORT = "stdio"
NOTION_TOKEN = "${NOTION_TOKEN}"

[mcp_servers.email]
command = "npx"
args = ["--yes", "@n24q02m/email@latest"]

[mcp_servers.email.env]
MCP_TRANSPORT = "stdio"
EMAIL_CREDENTIALS = "${EMAIL_CREDENTIALS}"

[mcp_servers.telegram]
command = "uvx"
args = ["--python", "3.13", "n24q02m-telegram@latest"]

[mcp_servers.telegram.env]
MCP_TRANSPORT = "stdio"
TELEGRAM_BOT_TOKEN = "${TELEGRAM_BOT_TOKEN}"

[mcp_servers.crg]
command = "uvx"
args = ["--python", "3.13", "n24q02m-crg@latest"]

[mcp_servers.crg.env]
MCP_TRANSPORT = "stdio"
EMBEDDING_MODELS = "${EMBEDDING_MODELS}"
LOCAL_EMBEDDING_MODEL = "${LOCAL_EMBEDDING_MODEL}"
LOCAL_EMBEDDING_DIM = "${LOCAL_EMBEDDING_DIM}"
LOCAL_RERANK_MODEL = "${LOCAL_RERANK_MODEL}"
LOCAL_EMBEDDING_MODEL_FILE = "${LOCAL_EMBEDDING_MODEL_FILE}"
LOCAL_EMBEDDING_POOLING = "${LOCAL_EMBEDDING_POOLING}"
LOCAL_EMBEDDING_NORMALIZE = "${LOCAL_EMBEDDING_NORMALIZE}"
HULL_EMBED_API_KEY = "${HULL_EMBED_API_KEY}"
HULL_CHAT_API_KEY = "${HULL_CHAT_API_KEY}"

[mcp_servers.workspace]
command = "npx"
args = ["--yes", "@n24q02m/workspace@latest"]

[mcp_servers.workspace.env]
MCP_TRANSPORT = "stdio"
GOOGLE_OAUTH_CLIENT_ID = "${GOOGLE_OAUTH_CLIENT_ID}"
GOOGLE_OAUTH_CLIENT_SECRET = "${GOOGLE_OAUTH_CLIENT_SECRET}"

[mcp_servers.skret]
command = "skret"
args = ["mcp", "--transport", "stdio"]
